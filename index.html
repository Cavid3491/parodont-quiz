let selectedIndices = [];
let userAnswers = {};

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function getRandom15Questions() {
    let indices = Array.from({length: rawData.length}, (_, i) => i);
    shuffleArray(indices);
    return indices.slice(0, 15);
}

function renderQuiz() {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';
    selectedIndices = getRandom15Questions();
    userAnswers = {};

    selectedIndices.forEach((qIdx, displayIdx) => {
        const qData = rawData[qIdx];
        const card = document.createElement('div');
        card.className = 'quiz-card';
        card.id = `card-${displayIdx}`;

        const qTitle = document.createElement('div');
        qTitle.className = 'question-title';
        qTitle.innerText = `${displayIdx + 1}. ${qData.q}`;
        card.appendChild(qTitle);

        const optionsList = document.createElement('ul');
        optionsList.className = 'options-list';

        // Prepare option shuffle while preserving correct target
        let optionsWithMeta = qData.options.map((optText, origIndex) => ({
            text: optText,
            isCorrect: origIndex === qData.answer,
            origIndex: origIndex
        }));
        
        shuffleArray(optionsWithMeta);
        card.dataset.optionsMeta = JSON.stringify(optionsWithMeta);

        optionsWithMeta.forEach((optObj, oIndex) => {
            const li = document.createElement('li');
            li.className = 'option-item';

            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.id = `btn-${displayIdx}-${oIndex}`;
            btn.innerText = `${String.fromCharCode(65 + oIndex)}) ${optObj.text}`;

            btn.onclick = () => selectOption(displayIdx, oIndex);

            li.appendChild(btn);
            optionsList.appendChild(li);
        });

        const expDiv = document.createElement('div');
        expDiv.className = 'explanation';
        expDiv.id = `exp-${displayIdx}`;
        expDiv.innerHTML = `<strong>İzah:</strong> ${qData.exp}`;

        card.appendChild(optionsList);
        card.appendChild(expDiv);
        container.appendChild(card);
    });

    document.getElementById('score-summary').style.display = 'none';
    document.getElementById('check-btn').style.display = 'block';
}

function selectOption(qDisplayIdx, optDisplayIdx) {
    userAnswers[qDisplayIdx] = optDisplayIdx;
    
    // Clear selected style for this card
    const card = document.getElementById(`card-${qDisplayIdx}`);
    const btns = card.querySelectorAll('.option-btn');
    btns.forEach(b => b.classList.remove('selected'));

    // Highlight chosen
    const selectedBtn = document.getElementById(`btn-${qDisplayIdx}-${optDisplayIdx}`);
    if (selectedBtn) {
        selectedBtn.classList.add('selected');
    }
}

function checkAnswers() {
    let score = 0;

    selectedIndices.forEach((qIdx, displayIdx) => {
        const card = document.getElementById(`card-${displayIdx}`);
        const optionsMeta = JSON.parse(card.dataset.optionsMeta);
        const userChoice = userAnswers[displayIdx];

        const btns = card.querySelectorAll('.option-btn');
        btns.forEach(b => {
            b.disabled = true;
            b.classList.remove('selected');
        });

        optionsMeta.forEach((optObj, oIndex) => {
            const btn = document.getElementById(`btn-${displayIdx}-${oIndex}`);
            if (optObj.isCorrect) {
                btn.classList.add('correct');
            }
            if (userChoice === oIndex && !optObj.isCorrect) {
                btn.classList.add('wrong');
            }
        });

        if (userChoice !== undefined && optionsMeta[userChoice].isCorrect) {
            score++;
        }

        const expDiv = document.getElementById(`exp-${displayIdx}`);
        expDiv.style.display = 'block';
    });

    // Display total score
    const scoreSummary = document.getElementById('score-summary');
    const scoreText = document.getElementById('score-text');
    scoreText.innerText = `${selectedIndices.length} sualdan ${score} doğru cavab verdiniz! (${Math.round((score/15)*100)}%)`;
    scoreSummary.style.display = 'block';

    // Scroll smoothly to top score summary
    scoreSummary.scrollIntoView({ behavior: 'smooth', block: 'center' });
    document.getElementById('check-btn').style.display = 'none';
}

window.onload = renderQuiz;
</script>

</body>
</html>
